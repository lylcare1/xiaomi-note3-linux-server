# 启用 journald persistent storage + 频繁 sync
# 默认 volatile (/run/log/journal/), 重启后丢失, 无法诊断上次启动失败.
# persistent 后日志保存在 /var/log/journal/, 重启后可读.
# SyncIntervalSec=1: 每秒 sync 到磁盘, 避免强制重启时丢失日志 (默认 5min).
# MaxLevelStore=debug: 保存 debug 级别日志, 方便诊断.
[Journal]
Storage=persistent
SyncIntervalSec=1
MaxLevelStore=debug
MaxLevelSyslog=debug
