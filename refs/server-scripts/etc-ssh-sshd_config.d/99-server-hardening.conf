# 对应设备 /etc/ssh/sshd_config.d/99-server-hardening.conf
# 来源: docs/troubleshooting.md §7.8.4 (P0-4/P0-6 SSH 加固)
#
# 应用: systemctl reload sshd
# 说明: fail2ban 在 Alpine 无 py3-systemd 包, 改用 sshd 内置加固

# 最多 3 次认证 (默认 6)
MaxAuthTries 3

# 20s 内必须完成认证 (默认 2min)
LoginGraceTime 20

# 并发未认证连接限制
MaxStartups 5:50:10

# 只允许 user 用户
AllowUsers user

# 禁用 root 登录
PermitRootLogin no

# 60s keepalive
ClientAliveInterval 60

# 3 次无响应断开
ClientAliveCountMax 3

# 禁空密码
PermitEmptyPasswords no

# 保留密码登录 (用户决定)
PasswordAuthentication yes

# 允许公钥 (可选)
PubkeyAuthentication yes
