# 对应设备 /etc/sysctl.d/99-server-hardening.conf
# 来源: docs/troubleshooting.md §7.8.1 (P0-1 sysctl 服务器加固)
#
# 应用: sysctl -p /etc/sysctl.d/99-server-hardening.conf

# Oops 自动重启 (之前 =0, 挂死风险)
kernel.panic_on_oops = 1

# Panic 后 120s 重启 (重申)
kernel.panic = 120

# PID 上限
kernel.pid_max = 4194304

# 文件描述符上限
fs.file-max = 2097152

# 防 SYN flood
net.ipv4.tcp_syncookies = 1

# 反向路径过滤
net.ipv4.conf.all.rp_filter = 1

# 拒绝 ICMP redirect
net.ipv4.conf.all.accept_redirects = 0

# keepalive 600s
net.ipv4.tcp_keepalive_time = 600

# OOM 策略
vm.overcommit_memory = 1

# 减少 swap 倾向
vm.swappiness = 10
