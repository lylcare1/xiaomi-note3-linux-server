# 对应设备 /etc/systemd/timesyncd.conf
# 来源: docs/故障排查.md §7.9.4 (P1-4 RTC 时钟持久化 / systemd-timesyncd 配置)
#
# 应用: systemctl restart systemd-timesyncd
# 说明: PMIC RTC 不可写 (ENODEV), NTP 正常时不用 FakeRTC 文件

[Time]
# 主 NTP 服务器
NTP=ntp.aliyun.com ntp1.aliyun.com cn.pool.ntp.org
# 后备 NTP 服务器
FallbackNTP=time.windows.com time.apple.com pool.ntp.org
